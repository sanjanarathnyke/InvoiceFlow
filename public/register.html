<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InvoiceFlow – Create Account</title>
  <meta name="description" content="Create your InvoiceFlow account and start managing invoices professionally"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["ui-monospace","SFMono-Regular","Menlo","Consolas","monospace"]}}}}</script>
  <style>
    body { font-family: "ui-monospace", "SFMono-Regular", Menlo, Consolas, monospace; }
    .glass { background: rgba(15,23,42,0.7); backdrop-filter: blur(20px); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .fade-up { animation: fadeUp .6s ease both; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px #1e293b inset !important; -webkit-text-fill-color: #f8fafc !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center relative overflow-hidden py-8">
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
  </div>
  <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg width=%2260%22 height=%2260%22 viewBox=%220 0 60 60%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cg fill=%22none%22 fill-rule=%22evenodd%22%3E%3Cg fill=%22%236366f1%22 fill-opacity=%220.04%22%3E%3Cpath d=%22M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E')] opacity-40"></div>

  <div class="relative w-full max-w-md mx-4 fade-up">
    <div class="text-center mb-8">
      <a href="/index.html" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 shadow-lg shadow-indigo-500/30 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </a>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">Get started</h1>
      <p class="text-slate-400 mt-1 text-sm">Create your InvoiceFlow account</p>
    </div>

    <div class="glass border border-slate-700/60 rounded-3xl p-8 shadow-2xl">
      <form id="register-form" novalidate>
        <div class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Full Name</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              </span>
              <input id="name" type="text" placeholder="John Smith" autocomplete="name"
                class="w-full bg-slate-800/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-indigo-500 transition-all"/>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Email address</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
              </span>
              <input id="email" type="email" placeholder="you@example.com" autocomplete="email"
                class="w-full bg-slate-800/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-indigo-500 transition-all"/>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              </span>
              <input id="password" type="password" placeholder="Min. 6 characters" autocomplete="new-password"
                class="w-full bg-slate-800/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-indigo-500 transition-all"/>
            </div>
          </div>

          <p id="error-msg" class="text-rose-400 text-sm hidden"></p>
          <p id="success-msg" class="text-emerald-400 text-sm hidden"></p>

          <button id="reg-btn" type="submit"
            class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-semibold text-sm shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center gap-2">
            <span id="btn-text">Create Account</span>
            <svg id="btn-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
          </button>
        </div>
      </form>

      <p class="text-center text-sm text-slate-400 mt-6">
        Already have an account?
        <a href="/index.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors ml-1">Sign in →</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (API.getToken()) window.location.href = "/dashboard.html";

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("error-msg");
      const sucEl = document.getElementById("success-msg");
      const btn = document.getElementById("reg-btn");
      const spinner = document.getElementById("btn-spinner");

      errEl.classList.add("hidden"); sucEl.classList.add("hidden");
      if (!name || !email || !password) { errEl.textContent = "All fields are required."; errEl.classList.remove("hidden"); return; }
      if (password.length < 6) { errEl.textContent = "Password must be at least 6 characters."; errEl.classList.remove("hidden"); return; }

      btn.disabled = true; spinner.classList.remove("hidden");
      try {
        await API.register(name, email, password);
        sucEl.textContent = "Account created! Redirecting to login…";
        sucEl.classList.remove("hidden");
        setTimeout(() => window.location.href = "/index.html", 1500);
      } catch (err) {
        errEl.textContent = err.message || "Registration failed. Please try again.";
        errEl.classList.remove("hidden");
        btn.disabled = false; spinner.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
