<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InvoiceFlow – Customers</title>
  <meta name="description" content="Manage your customers in InvoiceFlow"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["ui-monospace","SFMono-Regular","Menlo","Consolas","monospace"]}}}}</script>
  <style>
    body{font-family:"ui-monospace","SFMono-Regular",Menlo,Consolas,monospace;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .5s ease both;}
    .card{background:rgba(30,41,59,.6);backdrop-filter:blur(12px);border:1px solid rgba(51,65,85,.6);border-radius:1rem;}
    ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:#334155;border-radius:2px;}
    input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #1e293b inset!important;-webkit-text-fill-color:#f8fafc!important;}
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex">
  <div id="sidebar-placeholder"></div>
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 lg:hidden hidden" onclick="closeSidebar()"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen">
    <header class="sticky top-0 z-30 flex items-center justify-between px-6 py-4 bg-slate-950/80 backdrop-blur border-b border-slate-800">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-slate-800 text-slate-400">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 class="text-xl font-bold text-white">Customers</h1>
          <p class="text-slate-400 text-xs" id="customer-count">Loading…</p>
        </div>
      </div>
      <button onclick="openModal('customer-modal')" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white text-sm font-medium shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/40 hover:-translate-y-0.5 transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Add Customer
      </button>
    </header>

    <main class="flex-1 p-6">
      <!-- Search -->
      <div class="mb-5 fade-up">
        <div class="relative max-w-sm">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </span>
          <input id="search-input" type="text" placeholder="Search customers…"
            class="w-full bg-slate-800/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all"/>
        </div>
      </div>

      <!-- Table -->
      <div class="card fade-up" style="animation-delay:.1s">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-700/50">
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Name</th>
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Email</th>
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Phone</th>
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Address</th>
                <th class="text-right px-6 py-3.5 text-slate-400 font-medium">Actions</th>
              </tr>
            </thead>
            <tbody id="customers-tbody"></tbody>
          </table>
        </div>
        <div id="empty-state" class="hidden text-center py-16">
          <div class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center mx-auto mb-4 text-3xl">👤</div>
          <p class="text-slate-400 text-base font-medium">No customers yet</p>
          <p class="text-slate-500 text-sm mt-1">Click "Add Customer" to get started</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="customer-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-7 max-w-md w-full mx-4 shadow-2xl">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-white font-bold text-lg" id="modal-title">Add Customer</h2>
        <button onclick="closeModal('customer-modal')" class="text-slate-400 hover:text-white transition-colors p-1.5 hover:bg-slate-700 rounded-lg">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="customer-form" novalidate>
        <input type="hidden" id="customer-id"/>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Full Name *</label>
            <input id="c-name" type="text" placeholder="Jane Doe" class="w-full bg-slate-900/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
            <input id="c-email" type="email" placeholder="jane@example.com" class="w-full bg-slate-900/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Phone</label>
            <input id="c-phone" type="tel" placeholder="+1 (555) 000-0000" class="w-full bg-slate-900/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Address</label>
            <textarea id="c-address" placeholder="123 Main St, City, Country" rows="2" class="w-full bg-slate-900/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all resize-none"></textarea>
          </div>
        </div>
        <p id="modal-err" class="text-rose-400 text-sm mt-3 hidden"></p>
        <div class="flex gap-3 justify-end mt-6">
          <button type="button" onclick="closeModal('customer-modal')" class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-sm transition-colors">Cancel</button>
          <button type="submit" id="save-btn" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white text-sm font-medium hover:-translate-y-0.5 transition-all shadow-lg shadow-indigo-500/20 flex items-center gap-2">
            Save
            <svg id="save-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    if (!API.requireAuth()) void 0;
    fetch("/components/sidebar.html").then(r=>r.text()).then(html=>{
      document.getElementById("sidebar-placeholder").outerHTML=html;
      initNav();
      const av=document.getElementById("nav-avatar");
      if(av) av.textContent=(API.getUserName()||"U")[0].toUpperCase();
    });
    function toggleSidebar(){document.getElementById("sidebar")?.classList.toggle("-translate-x-full");document.getElementById("sidebar-overlay")?.classList.toggle("hidden");}
    function closeSidebar(){document.getElementById("sidebar")?.classList.add("-translate-x-full");document.getElementById("sidebar-overlay")?.classList.add("hidden");}

    let allCustomers = [];

    async function loadCustomers() {
      document.getElementById("customers-tbody").innerHTML = skeletonRows(5, 4);
      try {
        allCustomers = await API.getCustomers();
        renderTable(allCustomers);
      } catch(e) { showToast("Failed to load customers: " + e.message, "error"); }
    }

    function renderTable(data) {
      const tbody = document.getElementById("customers-tbody");
      const empty = document.getElementById("empty-state");
      document.getElementById("customer-count").textContent = `${data.length} customer${data.length !== 1 ? "s" : ""}`;
      if (!data.length) { tbody.innerHTML = ""; empty.classList.remove("hidden"); return; }
      empty.classList.add("hidden");
      tbody.innerHTML = data.map(c => `
        <tr class="border-t border-slate-700/30 hover:bg-slate-800/40 transition-colors">
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-400 to-violet-500 flex items-center justify-center text-xs font-bold text-white flex-shrink-0">${(c.name||"?")[0].toUpperCase()}</div>
              <span class="font-medium text-white">${c.name || "—"}</span>
            </div>
          </td>
          <td class="px-6 py-4 text-slate-300">${c.email || "—"}</td>
          <td class="px-6 py-4 text-slate-300">${c.phone || "—"}</td>
          <td class="px-6 py-4 text-slate-400 max-w-[180px] truncate" title="${c.address||""}">${c.address || "—"}</td>
          <td class="px-6 py-4">
            <div class="flex items-center justify-end gap-2">
              <button onclick="editCustomer(${c.id})" class="p-2 rounded-lg text-slate-400 hover:text-indigo-400 hover:bg-indigo-400/10 transition-colors" title="Edit">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </button>
              <button onclick="deleteCustomer(${c.id}, '${(c.name||"").replace(/'/g,"")}')" class="p-2 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-400/10 transition-colors" title="Delete">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </td>
        </tr>`).join("");
    }

    document.getElementById("search-input").addEventListener("input", e => {
      const q = e.target.value.toLowerCase();
      renderTable(allCustomers.filter(c => (c.name+c.email+c.phone+c.address).toLowerCase().includes(q)));
    });

    function openAddModal() {
      document.getElementById("modal-title").textContent = "Add Customer";
      document.getElementById("customer-id").value = "";
      ["c-name","c-email","c-phone","c-address"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("modal-err").classList.add("hidden");
      openModal("customer-modal");
    }
    // Rebind header button
    document.querySelector("button[onclick=\"openModal('customer-modal')\"]").onclick = openAddModal;

    function editCustomer(id) {
      const c = allCustomers.find(x => x.id === id);
      if (!c) return;
      document.getElementById("modal-title").textContent = "Edit Customer";
      document.getElementById("customer-id").value = id;
      document.getElementById("c-name").value    = c.name    || "";
      document.getElementById("c-email").value   = c.email   || "";
      document.getElementById("c-phone").value   = c.phone   || "";
      document.getElementById("c-address").value = c.address || "";
      document.getElementById("modal-err").classList.add("hidden");
      openModal("customer-modal");
    }

    async function deleteCustomer(id, name) {
      const ok = await confirmDelete(`Delete customer "${name}"? This action cannot be undone.`);
      if (!ok) return;
      try {
        await API.deleteCustomer(id);
        showToast("Customer deleted.", "success");
        loadCustomers();
      } catch(e) { showToast("Delete failed: " + e.message, "error"); }
    }

    document.getElementById("customer-form").addEventListener("submit", async e => {
      e.preventDefault();
      const id      = document.getElementById("customer-id").value;
      const name    = document.getElementById("c-name").value.trim();
      const email   = document.getElementById("c-email").value.trim();
      const phone   = document.getElementById("c-phone").value.trim();
      const address = document.getElementById("c-address").value.trim();
      const errEl   = document.getElementById("modal-err");
      const btn     = document.getElementById("save-btn");
      const sp      = document.getElementById("save-spinner");

      if (!name) { errEl.textContent = "Name is required."; errEl.classList.remove("hidden"); return; }
      errEl.classList.add("hidden");
      btn.disabled = true; sp.classList.remove("hidden");

      const payload = { userId: parseInt(API.getUserId()||1), name, email, phone, address };
      try {
        if (id) {
          await API.updateCustomer(id, payload);
          showToast("Customer updated!", "success");
        } else {
          await API.createCustomer(payload);
          showToast("Customer added!", "success");
        }
        closeModal("customer-modal");
        loadCustomers();
      } catch(err) {
        errEl.textContent = err.message || "Save failed.";
        errEl.classList.remove("hidden");
      } finally { btn.disabled = false; sp.classList.add("hidden"); }
    });

    loadCustomers();
  </script>
</body>
</html>
