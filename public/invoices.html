<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InvoiceFlow – Invoices</title>
  <meta name="description" content="View and manage all your invoices in InvoiceFlow"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["ui-monospace","SFMono-Regular","Menlo","Consolas","monospace"]}}}}</script>
  <style>
    body{font-family:"ui-monospace","SFMono-Regular",Menlo,Consolas,monospace;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .5s ease both;}
    .card{background:rgba(30,41,59,.6);backdrop-filter:blur(12px);border:1px solid rgba(51,65,85,.6);border-radius:1rem;}
    ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:#334155;border-radius:2px;}
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex">
  <div id="sidebar-placeholder"></div>
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 lg:hidden hidden" onclick="closeSidebar()"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen">
    <header class="sticky top-0 z-30 flex items-center justify-between px-6 py-4 bg-slate-950/80 backdrop-blur border-b border-slate-800">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-slate-800 text-slate-400">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 class="text-xl font-bold text-white">Invoices</h1>
          <p class="text-slate-400 text-xs" id="invoice-count">Loading…</p>
        </div>
      </div>
      <a href="/invoice-new.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white text-sm font-medium shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/40 hover:-translate-y-0.5 transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Invoice
      </a>
    </header>

    <main class="flex-1 p-6 space-y-5">
      <!-- Filters -->
      <div class="flex flex-wrap items-center gap-3 fade-up">
        <div class="relative flex-1 min-w-[200px] max-w-xs">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </span>
          <input id="search-input" type="text" placeholder="Search invoices…"
            class="w-full bg-slate-800/80 border border-slate-600/60 text-slate-100 placeholder-slate-500 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all"/>
        </div>
        <select id="status-filter" class="bg-slate-800/80 border border-slate-600/60 text-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
          <option value="">All Statuses</option>
          <option value="draft">Draft</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="overdue">Overdue</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <!-- Table -->
      <div class="card fade-up" style="animation-delay:.1s">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-700/50">
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Invoice #</th>
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Customer</th>
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Issue Date</th>
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Due Date</th>
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Total</th>
                <th class="text-left px-6 py-3.5 text-slate-400 font-medium">Status</th>
                <th class="text-right px-6 py-3.5 text-slate-400 font-medium">Actions</th>
              </tr>
            </thead>
            <tbody id="invoices-tbody"></tbody>
          </table>
        </div>
        <div id="empty-state" class="hidden text-center py-16">
          <div class="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center mx-auto mb-4 text-3xl">📄</div>
          <p class="text-slate-400 text-base font-medium">No invoices found</p>
          <p class="text-slate-500 text-sm mt-1"><a href="/invoice-new.html" class="text-indigo-400 hover:text-indigo-300">Create your first invoice →</a></p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    if (!API.requireAuth()) void 0;
    fetch("/components/sidebar.html").then(r=>r.text()).then(html=>{
      document.getElementById("sidebar-placeholder").outerHTML=html;
      initNav();
      const av=document.getElementById("nav-avatar");
      if(av) av.textContent=(API.getUserName()||"U")[0].toUpperCase();
    });
    function toggleSidebar(){document.getElementById("sidebar")?.classList.toggle("-translate-x-full");document.getElementById("sidebar-overlay")?.classList.toggle("hidden");}
    function closeSidebar(){document.getElementById("sidebar")?.classList.add("-translate-x-full");document.getElementById("sidebar-overlay")?.classList.add("hidden");}

    let allInvoices = [];

    async function loadInvoices() {
      document.getElementById("invoices-tbody").innerHTML = skeletonRows(7, 5);
      try {
        allInvoices = await API.getInvoices();
        applyFilters();
      } catch(e) { showToast("Failed to load invoices: " + e.message, "error"); }
    }

    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase();
      const st = document.getElementById("status-filter").value;
      let data = allInvoices;
      if (q) data = data.filter(i => (i.invoiceNumber + (i.Customer?.name||"") + (i.customerId||"")).toLowerCase().includes(q));
      if (st) data = data.filter(i => (i.status||"draft").toLowerCase() === st);
      renderTable(data);
    }

    function renderTable(data) {
      const tbody = document.getElementById("invoices-tbody");
      const empty = document.getElementById("empty-state");
      document.getElementById("invoice-count").textContent = `${data.length} invoice${data.length !== 1 ? "s" : ""}`;
      if (!data.length) { tbody.innerHTML=""; empty.classList.remove("hidden"); return; }
      empty.classList.add("hidden");
      tbody.innerHTML = data.map(inv => `
        <tr class="border-t border-slate-700/30 hover:bg-slate-800/40 transition-colors cursor-pointer" onclick="location.href='/invoice-detail.html?id=${inv.id}'">
          <td class="px-6 py-4 font-semibold text-indigo-400">${inv.invoiceNumber || `INV-${inv.id}`}</td>
          <td class="px-6 py-4 text-slate-300">${inv.Customer?.name || `Customer #${inv.customerId}` || "—"}</td>
          <td class="px-6 py-4 text-slate-400">${fmtDate(inv.issueDate)}</td>
          <td class="px-6 py-4 text-slate-400">${fmtDate(inv.dueDate)}</td>
          <td class="px-6 py-4 font-semibold text-white">${fmtCurrency(inv.total)}</td>
          <td class="px-6 py-4">${statusBadge(inv.status)}</td>
          <td class="px-6 py-4" onclick="event.stopPropagation()">
            <div class="flex items-center justify-end gap-2">
              <a href="/invoice-detail.html?id=${inv.id}" class="p-2 rounded-lg text-slate-400 hover:text-indigo-400 hover:bg-indigo-400/10 transition-colors" title="View">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </a>
              <button onclick="downloadOne(${inv.id})" class="p-2 rounded-lg text-slate-400 hover:text-emerald-400 hover:bg-emerald-400/10 transition-colors" title="Download PDF">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              </button>
              <button onclick="deleteInvoice(${inv.id})" class="p-2 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-400/10 transition-colors" title="Delete">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </td>
        </tr>`).join("");
    }

    document.getElementById("search-input").addEventListener("input", applyFilters);
    document.getElementById("status-filter").addEventListener("change", applyFilters);

    async function deleteInvoice(id) {
      const ok = await confirmDelete("Delete this invoice? This action cannot be undone.");
      if (!ok) return;
      try {
        await API.deleteInvoice(id);
        showToast("Invoice deleted.", "success");
        loadInvoices();
      } catch(e) { showToast("Delete failed: " + e.message, "error"); }
    }

    async function downloadOne(id) {
      try {
        const inv = await API.getInvoice(id);
        downloadInvoicePdf(inv);
      } catch(e) { showToast("Failed to prepare PDF: " + e.message, "error"); }
    }

    loadInvoices();
  </script>
</body>
</html>
